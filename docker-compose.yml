version: '3.9'
services:
  api:
    build:
      context: .
      target: builder
    command: pnpm --filter @afterhours/api dev
    ports:
      - "8787:8787"
    env_file: .env
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app/apps/api

  web:
    build:
      context: .
      target: builder
    command: pnpm --filter @afterhours/web dev
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules
    working_dir: /app/apps/web

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: afterhours
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
