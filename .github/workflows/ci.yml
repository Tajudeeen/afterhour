name: AfterHours CI

on:
  push:
    branches:
      - main
      - master
      - 'hack/*'
  pull_request:
    branches:
      - main
      - master
      - 'hack/*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
      - name: Build web
        run: pnpm --filter @afterhours/web build